<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="meshGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="45%" stop-color="#d4d4d8"/>
      <stop offset="85%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </radialGradient>
    <radialGradient id="ringGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="pcbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="meshHoles" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#27272a" opacity="0.65"/>
    </pattern>
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- PCB Baseboard -->
  <rect x="55" y="65" width="210" height="190" rx="14" fill="url(#pcbBlue)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow3D)"/>

  <!-- PCB Mount Holes -->
  <circle cx="75" cy="85" r="7" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="245" cy="85" r="7" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="75" cy="235" r="7" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="245" cy="235" r="7" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Trim Potentiometer (Blue Box with Silver Screw) -->
  <rect x="75" y="145" width="30" height="30" rx="3" fill="#2563eb" stroke="#1d4ed8"/>
  <circle cx="90" cy="160" r="7" fill="#e2e8f0" stroke="#94a3b8"/>
  <line x1="86" y1="160" x2="94" y2="160" stroke="#475569" stroke-width="2"/>

  <!-- Indicator LEDs (Power & Digital Out) -->
  <circle cx="80" cy="115" r="4" fill="#ef4444" stroke="#991b1b"/>
  <circle cx="95" cy="115" r="4" fill="#22c55e" stroke="#166534"/>

  <!-- Big Round Metallic Sensor Snout (MQ Chamber) -->
  <circle cx="175" cy="155" r="64" fill="url(#ringGrad)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="175" cy="155" r="54" fill="url(#meshGrad)"/>
  <!-- Steel Mesh Pattern -->
  <circle cx="175" cy="155" r="54" fill="url(#meshHoles)"/>
  <!-- Center Heat-Coil Indicator -->
  <circle cx="175" cy="155" r="16" fill="#f59e0b" opacity="0.35"/>
  <circle cx="175" cy="155" r="12" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Silkscreen Branding -->
  <text x="175" y="240" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">MQ GAS SENSOR</text>

  <!-- 4 Header Pins at bottom -->
  <g fill="#cbd5e1" stroke="#475569" stroke-width="1">
    <rect x="130" y="255" width="7" height="35" rx="1.5"/>
    <rect x="150" y="255" width="7" height="35" rx="1.5"/>
    <rect x="170" y="255" width="7" height="35" rx="1.5"/>
    <rect x="190" y="255" width="7" height="35" rx="1.5"/>
  </g>
  <text x="133" y="304" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">VCC</text>
  <text x="153" y="304" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">GND</text>
  <text x="173" y="304" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">DO</text>
  <text x="193" y="304" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">AO</text>
</svg>

