<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blueCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2590eb"/>
      <stop offset="50%" stop-color="#1472cb"/>
      <stop offset="100%" stop-color="#0b5299"/>
    </linearGradient>
    <linearGradient id="pinMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shadow & PCB Base -->
  <rect x="70" y="50" width="180" height="200" rx="14" fill="#0d1b12" opacity="0.3" filter="url(#dropShadow)"/>

  <!-- Sensor Plastic Enclosure (Classic DHT11 Blue Grid) -->
  <rect x="75" y="45" width="170" height="190" rx="12" fill="url(#blueCase)" stroke="#1a5c9e" stroke-width="2"/>
  <rect x="85" y="55" width="150" height="170" rx="8" fill="#176ab3" stroke="#0e4b82" stroke-width="1.5"/>

  <!-- Vent Grid Holes (DHT11 Ventilation Slots) -->
  <g fill="#0c3a64">
    <!-- Row 1 -->
    <rect x="98" y="70" width="18" height="24" rx="4"/>
    <rect x="124" y="70" width="18" height="24" rx="4"/>
    <rect x="150" y="70" width="18" height="24" rx="4"/>
    <rect x="176" y="70" width="18" height="24" rx="4"/>
    <rect x="202" y="70" width="18" height="24" rx="4"/>

    <!-- Row 2 -->
    <rect x="98" y="104" width="18" height="24" rx="4"/>
    <rect x="124" y="104" width="18" height="24" rx="4"/>
    <rect x="150" y="104" width="18" height="24" rx="4"/>
    <rect x="176" y="104" width="18" height="24" rx="4"/>
    <rect x="202" y="104" width="18" height="24" rx="4"/>

    <!-- Row 3 -->
    <rect x="98" y="138" width="18" height="24" rx="4"/>
    <rect x="124" y="138" width="18" height="24" rx="4"/>
    <rect x="150" y="138" width="18" height="24" rx="4"/>
    <rect x="176" y="138" width="18" height="24" rx="4"/>
    <rect x="202" y="138" width="18" height="24" rx="4"/>
  </g>

  <!-- DHT11 Product Label -->
  <rect x="95" y="176" width="130" height="38" rx="5" fill="#f8fafc"/>
  <text x="160" y="196" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">DHT11</text>
  <text x="160" y="208" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">HUMIDITY &amp; TEMP</text>

  <!-- Sensor 4 Connection Pins -->
  <g fill="url(#pinMetal)" stroke="#666" stroke-width="0.8">
    <rect x="100" y="235" width="8" height="52" rx="2"/>
    <rect x="126" y="235" width="8" height="52" rx="2"/>
    <rect x="152" y="235" width="8" height="52" rx="2"/>
    <rect x="178" y="235" width="8" height="52" rx="2"/>
  </g>

  <!-- Pin Labels -->
  <text x="104" y="300" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">VCC</text>
  <text x="130" y="300" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">DATA</text>
  <text x="156" y="300" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">NC</text>
  <text x="182" y="300" font-family="sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">GND</text>
</svg>

